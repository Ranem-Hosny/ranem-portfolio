# Netlify build & deploy configuration
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — anchor navigation works fine, but this future-proofs
# any client-side routes you might add later.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-term cache for the hashed JS/CSS assets Vite produces
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache static project images & videos
[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
